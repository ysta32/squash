<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Squash — Bug reports your cofounder actually reads.</title>
    <meta
      name="description"
      content="Squash is a tiny real-time bug tracker for two-person teams. Speak or paste a bug, and your cofounder sees it instantly."
    />
    <meta property="og:title" content="Squash — Bug reports your cofounder actually reads." />
    <meta
      property="og:description"
      content="Paste a screenshot. Say what’s broken. Get back to building. A real-time bug tracker for small teams."
    />
    <meta property="og:type" content="website" />
    <!-- Maintainer: before launch, set og:image and twitter:image to the absolute HTTPS URL of /og.png on your deployed site. Regenerate with npm run gen:og. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Squash — Bug reports your cofounder actually reads." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Squash — Bug reports your cofounder actually reads." />
    <meta
      name="twitter:description"
      content="Paste a screenshot. Say what’s broken. Get back to building."
    />
    <meta name="twitter:image" content="/og.png" />
    <meta name="twitter:image:alt" content="Squash — Bug reports your cofounder actually reads." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Squash" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
